name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, dependency-only gate: lint web, CMS and mobile; type-check web, CMS,
  # mobile and shared packages; unit tests. (Mobile is not *built* here — that
  # needs EAS.)
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose: the action reads the root
      # `package.json#packageManager`, so CI and local dev can never drift onto
      # different pnpm majors.
      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      # Pure-logic unit tests (vitest): the shared Payload mapper, reading time,
      # and the web ↔ CMS category list. No database or browser needed.
      - name: Unit tests
        run: pnpm test

  # Verify the apps actually build, then test them against a real database:
  # a throwaway Postgres with the committed migrations applied, the seed script,
  # Payload integration tests (hooks, slugs, access control, scheduled publish),
  # then Playwright on the production builds: the admin panel, then the public
  # site.
  build:
    name: Build & CMS tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        # Same major as local dev (docker-compose.yml) and production (Neon).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: akavish_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # --- CMS ---
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/akavish_ci
      PAYLOAD_SECRET: ci_dummy_secret_not_used_in_prod
      # R2 (media), Meilisearch (search), Resend (email) and Sentry (monitoring)
      # are deliberately left unset — each turns itself off and falls back (local
      # disk / no indexing / console-logged emails / no reporting), so the build
      # needs no third-party credentials. Sentry's build plugin also runs without
      # SENTRY_AUTH_TOKEN; it just skips the source map upload.
      # --- Web ---
      # Canonical Clerk placeholder key — lets next build pass without real creds.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci_dummy
      CMS_URL: http://localhost:3001
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Meilisearch intentionally unset — indexing/search degrade gracefully.
      # --- Both ---
      # Web ↔ CMS reader API (saved articles, comments). Same value on both
      # apps, as in production; without it the comments section says it's
      # unavailable and the e2e test of it fails.
      READER_API_SECRET: ci_reader_secret_not_used_in_prod

    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose: the action reads the root
      # `package.json#packageManager`, so CI and local dev can never drift onto
      # different pnpm majors.
      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (web + cms)
        run: pnpm build

      # Same command Railway runs before each deploy, on an empty database:
      # proves every committed migration still applies from scratch.
      - name: Apply migrations
        run: pnpm --filter akavish-cms migrate

      # Smoke test for `pnpm seed` (admin + sample content). Also gives the
      # admin panel tests something to list.
      - name: Seed
        run: pnpm seed

      - name: CMS integration tests
        run: pnpm --filter akavish-cms test:int

      # The browser comes from Playwright's CDN; its system libraries come from
      # Ubuntu's apt mirrors, which the runners sometimes can't reach (DNS
      # failures, 2026-11-11: the step hung 25 min, then failed on fonts).
      # The runner image already has almost all of them, so the apt part is
      # best-effort and capped; a real missing library still fails the e2e
      # tests below, loudly.
      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: |
          pnpm --filter akavish-cms exec playwright install chromium
          timeout 240 pnpm --filter akavish-cms exec playwright install-deps chromium \
            || echo "::warning::Playwright system deps not installed (apt mirrors unreachable?); using the runner's own libraries"

      # `pnpm start` on :3001 (Railway sets PORT itself, so the script doesn't
      # hard-code it). Playwright's webServer finds it already up and reuses it.
      - name: Start the CMS
        run: |
          PORT=3001 pnpm --filter akavish-cms start > cms.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3001/admin/login && exit 0
            sleep 2
          done
          echo "::error::CMS did not start"; cat cms.log; exit 1

      - name: CMS admin e2e (Playwright)
        run: pnpm --filter akavish-cms test:e2e

      # The public site on top of that CMS: home, categories + pagination,
      # article (alt text, JSON-LD), real 404s, search, slug-rename 308,
      # sitemap/RSS, theme toggle. Desktop + mobile viewports.
      # Rebuild the web app now that the CMS is up and seeded, like Vercel in
      # production: the first build ran with no CMS, so pages prerendered at
      # build time (sitemap.xml, feed.xml: revalidated every 5 min) were empty.
      - name: Rebuild the web app against the seeded CMS
        run: pnpm --filter @akavish/web build

      - name: Start the web app
        run: |
          PORT=3000 pnpm --filter @akavish/web start > web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "::error::Web app did not start"; cat web.log; exit 1

      - name: Public site e2e (Playwright)
        run: pnpm --filter @akavish/web test:e2e
