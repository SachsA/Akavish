packages:
  - "apps/*"
  - "packages/*"

# Moved here from the per-package "pnpm" field, which pnpm 10+ no longer reads.
overrides:
  react: 19.2.3
  react-dom: 19.2.3
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0

# Native deps allowed to run their build scripts (merged here from the old
# apps/cms/pnpm-workspace.yaml — a nested workspace file would make apps/cms look
# like its own workspace root, so it must not exist).
onlyBuiltDependencies:
  - sharp
  - esbuild
  - unrs-resolver
